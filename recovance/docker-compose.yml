services:
  postgres:
    image: postgres:17-alpine
    container_name: recovance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recovance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recovance}
      POSTGRES_DB: ${POSTGRES_DB:-recovance}
    # Host port 5433 — 5432 is left free for other local Postgres instances.
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - recovance-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recovance} -d ${POSTGRES_DB:-recovance}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  recovance-pgdata:
